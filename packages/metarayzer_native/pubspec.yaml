name: metarayzer_native
description: "macOS native layer for MetaRayzer: companion frame link, latest-frame pipeline and Apple Vision hand detection."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: MetarayzerNativePlugin
