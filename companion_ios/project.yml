# XcodeGen spec for the iPhone companion. The generated MetaRayzerCompanion.xcodeproj is
# committed, so XcodeGen is only needed if you change this file:  cd companion_ios && xcodegen
name: MetaRayzerCompanion
options:
  bundleIdPrefix: com.metarayzer
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  MetaRayzerCompanion:
    type: application
    platform: iOS
    sources:
      - path: MetaRayzerCompanion
        excludes: ["Info.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(COMPANION_BUNDLE_ID)
        INFOPLIST_FILE: MetaRayzerCompanion/Info.plist
        CODE_SIGN_ENTITLEMENTS: MetaRayzerCompanion/MetaRayzerCompanion.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATMockDevice
